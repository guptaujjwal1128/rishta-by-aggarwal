name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGION: ${{ vars.ARTIFACT_REGION || vars.GCP_REGION }}
  BACKEND_REGION: ${{ vars.BACKEND_REGION || vars.GCP_REGION }}
  FRONTEND_REGION: ${{ vars.FRONTEND_REGION || vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
  BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE }}
  FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE }}
  VERTEX_AI_LOCATION: ${{ vars.VERTEX_AI_LOCATION }}
  VERTEX_AI_IMAGE_PROCESSING_PRIMARY: ${{ vars.VERTEX_AI_IMAGE_PROCESSING_PRIMARY }}
  VERTEX_AI_IMAGE_PROCESSING_SECONDARY: ${{ vars.VERTEX_AI_IMAGE_PROCESSING_SECONDARY }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
  NODE_ENV: production
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  GCS_UPLOAD_BUCKET: ${{ vars.GCS_UPLOAD_BUCKET }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          missing=0
          required_variables=(
            PROJECT_ID
            GCP_REGION
            ARTIFACT_REPOSITORY
            BACKEND_SERVICE
            FRONTEND_SERVICE
            VERTEX_AI_LOCATION
            VERTEX_AI_IMAGE_PROCESSING_PRIMARY
            VERTEX_AI_IMAGE_PROCESSING_SECONDARY
            RUNTIME_SERVICE_ACCOUNT
            GOOGLE_CLIENT_ID
            GCS_UPLOAD_BUCKET
            CLOUD_SQL_INSTANCE
            VITE_API_URL
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Missing GitHub Actions repository variable: ${variable_name}"
              missing=1
            fi
          done

          if [[ -z "${GCP_SA_KEY}" ]]; then
            echo "::error::Missing GitHub Actions repository secret: GCP_SA_KEY"
            missing=1
          fi

          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${ARTIFACT_REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        run: |
          docker build \
            -t "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:${GITHUB_SHA}" \
            -t "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:latest" \
            backend

      - name: Build frontend image
        run: |
          docker build \
            -t "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_SERVICE}:${GITHUB_SHA}" \
            -t "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_SERVICE}:latest" \
            frontend

      - name: Push backend image
        run: |
          docker push "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:${GITHUB_SHA}"
          docker push "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:latest"

      - name: Push frontend image
        run: |
          docker push "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_SERVICE}:${GITHUB_SHA}"
          docker push "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_SERVICE}:latest"

      - name: Deploy backend
        run: |
          ENV_VARS="NODE_ENV=${NODE_ENV},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID},GCP_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION},VERTEX_AI_IMAGE_PROCESSING_PRIMARY=${VERTEX_AI_IMAGE_PROCESSING_PRIMARY},VERTEX_AI_IMAGE_PROCESSING_SECONDARY=${VERTEX_AI_IMAGE_PROCESSING_SECONDARY},GCS_UPLOAD_BUCKET=${GCS_UPLOAD_BUCKET}"
          SECRET_VARS="DATABASE_URL=rishta-database-url:latest,JWT_SECRET=rishta-jwt-secret:latest"

          gcloud run deploy "${BACKEND_SERVICE}" \
            --image "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${BACKEND_SERVICE}:${GITHUB_SHA}" \
            --region "${BACKEND_REGION}" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "${ENV_VARS}" \
            --set-secrets "${SECRET_VARS}"

      - name: Deploy frontend
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FRONTEND_SERVICE}:${GITHUB_SHA}" \
            --region "${FRONTEND_REGION}" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars "VITE_API_URL=${VITE_API_URL},VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
