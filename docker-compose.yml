services:
  postgres:
    image: postgres:16-alpine
    container_name: rishta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rishta
      POSTGRES_PASSWORD: rishta
      POSTGRES_DB: rishta_dev
    ports:
      - "5433:5432"
    volumes:
      - rishta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rishta -d rishta_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rishta_postgres_data:
